<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falcon Trade Journal - History</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Modal (Edit Popup & View Image) Styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1e293b;
            color: #f8fafc;
            padding: 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
        }

        .image-modal-content {
            max-width: 800px;
            text-align: center;
        }

        .image-modal-content img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            font-size: 24px;
            cursor: pointer;
            color: #94a3b8;
        }

        .close-btn:hover { color: #fff; }

        .btn-view {
            background: #059669;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 5px;
        }

        .btn-edit {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 5px;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .image-preview-container {
            margin-top: 10px;
            text-align: center;
        }

        .image-preview-container img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-link">
            <div class="logo-container">
                <img src="logo.svg" alt="Falcon Trade Journal Logo">
            </div>
        </a>
        
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="add-trade.html">Add Trade</a>
            <a href="history.html" class="active">Trade History</a>
            <a href="money-management.html">Money Management</a>
            <div id="settingsIconBtn" class="nav-icon-wrapper" onclick="toggleSettingsDropdown(event)">
                <a href="#" class="nav-icon-link" title="Account & Settings">
                    <svg class="settings-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </a>
            </div>
        </nav>
    </header>

    <div class="main-container">
        <h2>All Recorded Trades</h2>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Pair</th>
                    <th>Type</th>
                    <th>Model</th>
                    <th>Outcome</th>
                    <th>PNL ($)</th>
                    <th>Chart</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tradeTableBody">
            </tbody>
        </table>
    </div>

    <!-- Edit Trade Modal Window -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Trade Log</h3>
                <span class="close-btn" onclick="closeEditModal()">&times;</span>
            </div>
            <form id="editTradeForm" onsubmit="saveEditedTrade(event)">
                <input type="hidden" id="editTradeId">
                
                <div class="form-group">
                    <label>Trade Date</label>
                    <input type="date" id="editDate" required>
                </div>
                <div class="form-group">
                    <label>Pair / Asset</label>
                    <input type="text" id="editPair" required>
                </div>
                <div class="form-group">
                    <label>Trade Type</label>
                    <select id="editType">
                        <option value="BUY">BUY / LONG</option>
                        <option value="SELL">SELL / SHORT</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Trading Model</label>
                    <input type="text" id="editModel" required>
                </div>
                <div class="form-group">
                    <label>Profit / Loss ($ PnL)</label>
                    <input type="number" step="any" id="editPnl" required>
                </div>
                <div class="form-group">
                    <label>Outcome</label>
                    <select id="editResult">
                        <option value="WIN">WIN 🟢</option>
                        <option value="LOSS">LOSS 🔴</option>
                        <option value="BE">BREAKEVEN ⚪</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Update Chart Screenshot / URL</label>
                    <input type="file" id="editFileInput" accept="image/*" onchange="previewEditImage(event)">
                    <p style="text-align: center; margin: 5px 0; font-size: 12px; opacity: 0.7;">- OR -</p>
                    <input type="url" id="editImageUrl" placeholder="Paste Image Link" oninput="previewEditUrlImage()">
                    
                    <div id="editImagePreviewBox" class="image-preview-container">
                        <img id="editImgPreview" src="" alt="Chart Preview">
                    </div>
                </div>
                <br>
                <button type="submit" class="btn-submit">Update Trade</button>
            </form>
        </div>
    </div>

    <!-- View Chart Screenshot Modal -->
    <div id="viewImageModal" class="modal">
        <div class="modal-content image-modal-content">
            <div class="modal-header">
                <h3 id="imageModalTitle">Trade Screenshot</h3>
                <span class="close-btn" onclick="closeImageModal()">&times;</span>
            </div>
            <img id="modalFullImage" src="" alt="Trade Chart Screenshot">
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Falcon Trade Journal. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        let editBase64Image = "";

        // Render Trades Function
        function loadTrades() {
            const trades = JSON.parse(localStorage.getItem('falcon_trades')) || [];
            const tbody = document.getElementById('tradeTableBody');
            tbody.innerHTML = '';

            if (trades.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">No trades recorded yet.</td></tr>';
                return;
            }

            trades.forEach(trade => {
                const row = document.createElement('tr');
                
                // Chart button / preview string
                const chartBtn = trade.image 
                    ? `<button class="btn-view" onclick="viewTradeImage('${trade.id}')">View</button>` 
                    : `-`;

                row.innerHTML = `
                    <td>${trade.date}</td>
                    <td><strong>${trade.pair}</strong></td>
                    <td>${trade.type}</td>
                    <td>${trade.model || '-'}</td>
                    <td>${trade.result}</td>
                    <td style="color: ${trade.pnl >= 0 ? '#4ade80' : '#f87171'}; font-weight: bold;">
                        ${trade.pnl >= 0 ? '+' : ''}$${trade.pnl}
                    </td>
                    <td>${chartBtn}</td>
                    <td>
                        <button class="btn-edit" onclick="openEditModal(${trade.id})">Edit</button>
                        <button class="btn-delete" onclick="deleteTrade(${trade.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // View Image Modal Function
        function viewTradeImage(id) {
            const trades = JSON.parse(localStorage.getItem('falcon_trades')) || [];
            const trade = trades.find(t => t.id == id);

            if (trade && trade.image) {
                document.getElementById('imageModalTitle').innerText = `${trade.pair} (${trade.type}) - ${trade.date}`;
                document.getElementById('modalFullImage').src = trade.image;
                document.getElementById('viewImageModal').style.display = 'flex';
            }
        }

        function closeImageModal() {
            document.getElementById('viewImageModal').style.display = 'none';
        }

        // Open Edit Modal
        function openEditModal(id) {
            const trades = JSON.parse(localStorage.getItem('falcon_trades')) || [];
            const trade = trades.find(t => t.id === id);

            if (trade) {
                document.getElementById('editTradeId').value = trade.id;
                document.getElementById('editDate').value = trade.date;
                document.getElementById('editPair').value = trade.pair;
                document.getElementById('editType').value = trade.type;
                document.getElementById('editModel').value = trade.model || '';
                document.getElementById('editPnl').value = trade.pnl;
                document.getElementById('editResult').value = trade.result;
                
                editBase64Image = trade.image || "";
                if (editBase64Image) {
                    document.getElementById('editImgPreview').src = editBase64Image;
                    document.getElementById('editImagePreviewBox').style.display = 'block';
                } else {
                    document.getElementById('editImagePreviewBox').style.display = 'none';
                }
                
                document.getElementById('editModal').style.display = 'flex';
            }
        }

        // Edit Image Previews
        function previewEditImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    editBase64Image = e.target.result;
                    document.getElementById('editImgPreview').src = editBase64Image;
                    document.getElementById('editImagePreviewBox').style.display = 'block';
                    document.getElementById('editImageUrl').value = '';
                }
                reader.readAsDataURL(file);
            }
        }

        function previewEditUrlImage() {
            const url = document.getElementById('editImageUrl').value.trim();
            if (url) {
                editBase64Image = url;
                document.getElementById('editImgPreview').src = url;
                document.getElementById('editImagePreviewBox').style.display = 'block';
                document.getElementById('editFileInput').value = '';
            }
        }

        // Close Edit Modal
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // Save Edited Trade
        function saveEditedTrade(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('editTradeId').value);
            let trades = JSON.parse(localStorage.getItem('falcon_trades')) || [];

            trades = trades.map(trade => {
                if (trade.id === id) {
                    return {
                        id: id,
                        date: document.getElementById('editDate').value,
                        pair: document.getElementById('editPair').value.toUpperCase().trim(),
                        type: document.getElementById('editType').value,
                        model: document.getElementById('editModel').value,
                        pnl: parseFloat(document.getElementById('editPnl').value) || 0,
                        result: document.getElementById('editResult').value,
                        image: editBase64Image || ""
                    };
                }
                return trade;
            });

            localStorage.setItem('falcon_trades', JSON.stringify(trades));
            closeEditModal();
            loadTrades();
        }

        // Delete Trade
        function deleteTrade(id) {
            if (confirm('Are you sure you want to delete this trade log?')) {
                let trades = JSON.parse(localStorage.getItem('falcon_trades')) || [];
                trades = trades.filter(t => t.id !== id);
                localStorage.setItem('falcon_trades', JSON.stringify(trades));
                loadTrades();
            }
        }

        // Close Modals on Outer Click
        window.onclick = function(event) {
            const editModal = document.getElementById('editModal');
            const viewModal = document.getElementById('viewImageModal');
            if (event.target === editModal) closeEditModal();
            if (event.target === viewModal) closeImageModal();
        }

        // Load trades on page load
        document.addEventListener('DOMContentLoaded', loadTrades);
    </script>
</body>
</html>
