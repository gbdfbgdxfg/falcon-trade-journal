<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Gradient Colors for Falcon Icon -->
    <linearGradient id="falconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27ae60" />
      <stop offset="100%" stop-color="#2ecc71" />
    </linearGradient>
  </defs>

  <!-- Falcon Wing + Trading Chart Arrow Vector Shape -->
  <g transform="translate(10, 10)">
    <!-- Background Circle Shield -->
    <circle cx="50" cy="50" r="45" fill="#1a252f" />
    
    <!-- Geometric Falcon Wing & Uptrend Arrow -->
    <path d="M 25 65 
             L 40 50 
             L 50 60 
             L 75 30 
             L 60 30 
             L 75 30 
             L 75 45 
             L 55 68 
             L 40 58 
             L 28 72 Z" 
          fill="url(#falconGrad)" />
          
    <!-- Sharp Falcon Eye Detail -->
    <polygon points="58,38 68,34 62,44" fill="#ffffff" />
  </g>

  <!-- Falcon Brand Text (White Color) -->
  <text x="120" y="62" font-family="'Segoe UI', sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="1">
    FALCON
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="122" y="85" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#27ae60" letter-spacing="4">
    TRADE JOURNAL
  </text>
</svg>
