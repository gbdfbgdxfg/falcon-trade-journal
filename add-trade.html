<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeLog Pro - Add Trade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

     <header>
    <a href="index.html" class="logo-link">
        <div class="logo-container">
            <img src="logo.svg" alt="Falcon Trade Journal Logo">
        </div>
    </a>
    
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="add-trade.html">Add Trade</a>
        <a href="history.html">Trade History</a>
        <a href="money-management.html">Money Management</a>
    </nav>
</header>

    <div class="main-container">
        <div class="form-box">
            <h2>Record New Trade</h2>
            <br>
            <form id="addTradeForm">
    <div class="form-group">
        <label>Trade Date</label>
        <input type="date" id="tradeDate" required>
    </div>
    <div class="form-group">
        <label>Pair / Asset</label>
        <input type="text" id="tradePair" placeholder="e.g. BTC/USDT" required>
    </div>
    <div class="form-group">
        <label>Type</label>
        <select id="tradeType">
            <option value="BUY">BUY</option>
            <option value="SELL">SELL</option>
        </select>
    </div>
    <div class="form-group">
        <label>Entry Price ($)</label>
        <input type="number" step="any" id="entryPrice" required>
    </div>
    <div class="form-group">
        <label>Exit Price ($)</label>
        <input type="number" step="any" id="exitPrice" required>
    </div>
    <div class="form-group">
        <label>Profit / Loss ($)</label>
        <input type="number" step="any" id="pnl" placeholder="Minus (-) for Loss" required>
    </div>
    <div class="form-group">
        <label>Notes / Strategy</label>
        <textarea id="tradeNotes" rows="4"></textarea>
    </div>
    <button type="submit" class="btn-submit">Save Trade Entry</button>
</form>
        </div>
    </div>

    <footer>
        <script src="script.js"></script>
        <p>&copy; 2026 TradeLog Pro. All Rights Reserved.</p>
        
    </footer>

</body>
</html>
