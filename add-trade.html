<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeLog Pro - Add Trade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

     <header>
    <a href="index.html" class="logo-link">
        <div class="logo-container">
            <img src="logo.svg" alt="Falcon Trade Journal Logo">
        </div>
    </a>
    
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="add-trade.html">Add Trade</a>
        <a href="history.html">Trade History</a>
        <a href="money-management.html">Money Management</a>
    </nav>
</header>

    <div class="main-container">
        <div class="form-box">
            <h2>Record New Trade</h2>
            <br>
            <form>
                <div class="form-group">
                    <label>Trade Date</label>
                    <input type="date" required>
                </div>
                <div class="form-group">
                    <label>Pair / Asset</label>
                    <input type="text" placeholder="e.g. BTC/USDT" required>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select>
                        <option value="BUY">BUY</option>
                        <option value="SELL">SELL</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Entry Price ($)</label>
                    <input type="number" step="any" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label>Exit Price ($)</label>
                    <input type="number" step="any" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label>Profit / Loss ($)</label>
                    <input type="number" step="any" placeholder="Use minus (-) for Loss" required>
                </div>
                <div class="form-group">
                    <label>Notes / Strategy</label>
                    <textarea rows="4" placeholder="Why did you take this trade?"></textarea>
                </div>
                <button type="button" class="btn-submit">Save Trade Entry</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 TradeLog Pro. All Rights Reserved.</p>
    </footer>

</body>
</html>
