<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falcon Trade Journal - Economic Calendar & News</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .news-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            margin-top: 20px;
        }

        @media (min-width: 1024px) {
            .news-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .widget-card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .widget-card h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #f3f4f6;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .widget-container {
            height: 550px;
            border-radius: 12px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-link">
            <div class="logo-container">
                <img src="logo.svg" alt="Falcon Trade Journal Logo">
            </div>
        </a>
        
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="add-trade.html">Add Trade</a>
            <a href="history.html">Trade History</a>
            <a href="money-management.html">Money Management</a>
            <a href="calendar.html" class="active">News & Calendar</a>
            <div id="settingsIconBtn" class="nav-icon-wrapper" onclick="toggleSettingsDropdown(event)">
                <a href="#" class="nav-icon-link" title="Account & Settings">
                    <svg class="settings-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </a>
            </div>
        </nav>
    </header>

    <div class="main-container">
        <h2>Economic Calendar & Market News</h2>
        <p style="color: #9ca3af; margin-bottom: 20px;">Track high-impact macroeconomic events and market-moving breaking news in real-time.</p>

        <div class="news-grid">
            <!-- Economic Calendar Widget -->
            <div class="widget-card">
                <h3>📅 Economic Calendar</h3>
                <div class="widget-container">
                    <div class="tradingview-widget-container" style="height:100%;width:100%;">
                        <div class="tradingview-widget-container__widget" style="height:100%;width:100%;"></div>
                        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
                        {
                            "colorTheme": "dark",
                            "isTransparent": true,
                            "width": "100%",
                            "height": "100%",
                            "locale": "en",
                            "importanceFilter": "-1,0,1",
                            "currencyFilter": "USD,EUR,GBP,JPY,AUD,CAD,CHF,NZD"
                        }
                        </script>
                    </div>
                </div>
            </div>

            <!-- News Aggregator Widget -->
            <div class="widget-card">
                <h3>📰 Live Market News Headlines</h3>
                <div class="widget-container">
                    <div class="tradingview-widget-container" style="height:100%;width:100%;">
                        <div class="tradingview-widget-container__widget" style="height:100%;width:100%;"></div>
                        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
                        {
                            "feedMode": "all_symbols",
                            "colorTheme": "dark",
                            "isTransparent": true,
                            "displayMode": "regular",
                            "width": "100%",
                            "height": "100%",
                            "locale": "en"
                        }
                        </script>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Falcon Trade Journal. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
